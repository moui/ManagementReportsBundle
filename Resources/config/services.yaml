services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # The bundle class itself must stay registered: PluginManager discovers
    # plugins through the PluginInterface tag on the *service*.
    KimaiPlugin\ManagementReportsBundle\:
        resource: '../../*'
        exclude:
            - '../../Resources/'
            - '../../Model/'
            - '../../vendor/'

    KimaiPlugin\ManagementReportsBundle\Controller\:
        resource: '../../Controller/'
        tags: ['controller.service_arguments']
